# Disney Channel Subscription Offer Configuration
# 25% Off Annual Subscription Campaign

# Offer Details
offer.name=Disney Channel Premium Annual Subscription
offer.discount.percentage=25
offer.discount.type=ANNUAL_SUBSCRIPTION
offer.original.price=120.00
offer.discounted.price=90.00
offer.currency=USD
offer.duration.months=12

# Campaign Configuration
campaign.name=Disney 25% Off Annual Subscription
campaign.start.date=2026-05-04
campaign.end.date=2026-06-04
campaign.status=ACTIVE

# Target Audience
campaign.target.users.min=10
campaign.target.users.max=1000
campaign.eligible.regions=US,CA,UK,AU

# Notification Configuration
notification.email.enabled=true
notification.sms.enabled=true
notification.push.enabled=false

# Email Settings
email.from.address=offers@disneychannel.com
email.subject=Exclusive Offer: 25% Off Annual Subscription to Disney Channel
email.template=disney_annual_offer

# SMS Settings
sms.from.number=+1234567890
sms.message.template=disney_sms_offer

# Monitoring Configuration
monitor.tracking.enabled=true
monitor.acceptance.threshold=30
monitor.decline.threshold=20

# Database Configuration
db.type=sqlite
db.path=./campaign_tracking.db
db.auto.create=true
